[project]
name = "url-fairy-bot"
version = "2.0.0"
description = "I help to watch content from TikTok, Shorts, Twitter and Instagram Reels more convenient inside Telegram chatgroups"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vladimir nett00n Budylnikov", email = "git@nett00n.org" }
]

dependencies = [
  "aiogram-utils>=0.1.4,<0.2.0",
  "fastapi>=0.111.0,<0.112.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "requests>=2.32.4,<3.0.0",
  "yt-dlp>=2025.2.19",
  "pydantic-settings>=2.6.0,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
]

[dependency-groups]
dev = [
  "black>=24.4.2,<25.0.0",
  "flake8>=7.0.0,<8.0.0",
  "pytest>=8.2.0,<9.0.0",
  "yamllint>=1.35.1,<2.0.0",
  "httpx>=0.27.2,<0.28.0",
  "pytest-asyncio>=0.24.0,<0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
