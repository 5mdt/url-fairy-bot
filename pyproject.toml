[project]
name = "url-fairy-bot"
version = "2.0.0"
description = "I help to watch content from TikTok, Shorts, Twitter and Instagram Reels more convenient inside Telegram chatgroups"
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "Vladimir nett00n Budylnikov", email = "git@nett00n.org" }
]

dependencies = [
  "aiogram>=3.31.0,<4.0.0",
  "fastapi>=0.142.0,<1.0.0",
  "jinja2>=3.1.6,<4.0.0",
  "uvicorn>=0.54.0,<1.0.0",
  "python-dotenv>=1.2.4,<2.0.0",
  "requests>=2.34.2,<3.0.0",
  "yt-dlp>=2026.8.19",
  "pydantic-settings>=2.15.0,<3.0.0",
  "pyyaml>=6.0.3,<7.0.0",
]

[dependency-groups]
dev = [
  "black>=26.5.1,<27.0.0",
  "flake8>=7.4.1,<8.0.0",
  "pytest>=9.1.1,<10.0.0",
  "yamllint>=1.38.0,<2.0.0",
  "httpx>=0.28.1,<0.29.0",
  "pytest-asyncio>=1.4.0,<2.0.0",
  "isort>=9.0.2,<10.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
