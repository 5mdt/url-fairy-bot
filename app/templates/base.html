<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}🪄 URL-Fairy{% endblock %}</title>
    {% block meta %}{% endblock %}
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #2e3440;
            color: #d8dee9;
            align-self: center;
            font-size: larger;
            word-wrap: break-word;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #2e3440;
                color: #d8dee9;
            }
        }

        h1 {
            color: #88c0d0;
        }

        video {
            max-width: 100%;
            border-radius: 5px;
            background-color: #3b4252;
        }

        pre {
            white-space: pre-wrap;
            background-color: #3b4252;
            color: #d8dee9;
            padding: 10px;
            border-radius: 5px;
        }

        a {
            color: #81a1c1;
            text-decoration: underline;
        }

        a[href$=".mp4"]::before {
            content: "⬇️ ";
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
<hr>
    {% include "_footer.html" %}
</body>
</html>
