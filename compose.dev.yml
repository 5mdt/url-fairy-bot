# compose.dev.yml
# Local-development override: build the app image from source instead of
# pulling from GHCR. nginx has no image of its own to build — it's the
# stock nginx image, completely unmodified, so dev and prod use it
# identically. Usage:
# docker compose -f docker-compose.yml -f compose.dev.yml ...

---
services:

  app:
    build:
      context: ./
    image: url-fairy-bot:dev
    develop:
      watch:
        - action: rebuild
          path: app/
