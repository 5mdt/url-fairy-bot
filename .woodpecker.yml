---
# Docker image build pipeline (migrated from .github/workflows/build-and-push.yml).
# #UFB-0028
# The PR dry-run uses the buildx plugin (privileged via the server's
# WOODPECKER_PLUGINS_PRIVILEGED); `publish` is a commands step, so its
# `privileged: true` needs the repo's trusted.security flag.
# Credentials are global Woodpecker secrets 5mdt_docker_io_{url,user,pat}; the
# global `docker.io` registry entry is only used to pull step images.
variables:
  - &buildx
    image: docker.io/woodpeckerci/plugin-docker-buildx
  - &buildx_settings
    dockerfile: Dockerfile
    # linux/arm (armv7) is omitted: the runner has no QEMU binfmt for it, so
    # every RUN step dies with `exec format error`. Re-add once the runner
    # registers it (`tonistiigi/binfmt --install arm`).
    platforms: &platforms linux/amd64,linux/arm64
    repo: &repo 5mdt/url-fairy-bot
    registry:
      from_secret: 5mdt_docker_io_url
    username:
      from_secret: 5mdt_docker_io_user
    password:
      from_secret: 5mdt_docker_io_pat
when:
  - event:
      - push
      - pull_request
      - tag
      - manual
      - cron
# Fetch tags so publish can see git tags pointing at a pushed commit.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true
steps:
  # PRs only prove the image still builds (no push).
  - name: image-check
    !!merge <<: *buildx
    settings:
      !!merge <<: *buildx_settings
      dry_run: true
    when:
      - event: pull_request
  # Computes tags, then re-tags an existing <short sha> image or builds one.
  # The weekly cron job on main (schedule `0 0 0 * * 0`, Cron tab) always builds.
  - name: publish
    image: docker.io/library/docker:dind
    privileged: true
    environment:
      PLATFORMS: *platforms
      REPO: *repo
      REGISTRY:
        from_secret: 5mdt_docker_io_url
      DOCKER_USERNAME:
        from_secret: 5mdt_docker_io_user
      DOCKER_PASSWORD:
        from_secret: 5mdt_docker_io_pat
    commands:
      - apk add --no-cache git jq
      - sh scripts/ci/publish.sh
    when:
      - event:
          - push
          - manual
          - tag
          - cron
