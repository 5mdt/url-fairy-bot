---
# Docker image build pipeline (migrated from .github/workflows/build-and-push.yml).
# #UFB-0028
# Privileged mode for the buildx plugin comes from the server: it must list the
# image in WOODPECKER_PLUGINS_PRIVILEGED (a step-level `privileged: true` would
# instead need the repo's trusted.security flag).
# Credentials are global Woodpecker secrets 5mdt_docker_io_{url,user,pat}; the
# global `docker.io` registry entry is only used to pull step images.
variables:
  - &buildx
    image: docker.io/woodpeckerci/plugin-docker-buildx
  - &buildx_settings
    dockerfile: Dockerfile
    # linux/arm (armv7) is omitted: the runner has no QEMU binfmt for it, so
    # every RUN step dies with `exec format error`. Re-add once the runner
    # registers it (`tonistiigi/binfmt --install arm`).
    platforms: linux/amd64,linux/arm64
    repo: 5mdt/url-fairy-bot
    registry:
      from_secret: 5mdt_docker_io_url
    username:
      from_secret: 5mdt_docker_io_user
    password:
      from_secret: 5mdt_docker_io_pat
when:
  - event:
      - push
      - pull_request
      - tag
      - manual
      - cron
# Fetch tags so image-tags can see git tags pointing at a pushed commit.
clone:
  git:
    settings:
      tags: true
steps:
  # PRs only prove the image still builds (no push).
  - name: image-check
    !!merge <<: *buildx
    settings:
      !!merge <<: *buildx_settings
      dry_run: true
    when:
      - event: pull_request
  # main (push, weekly cron, or manual) -> `stable` + short sha; git tag -> the
  # tag; any other branch -> its own name with '/' replaced by '-' (image tags
  # can't contain '/'). The Sunday run needs a cron job on branch main in the
  # repo's Woodpecker settings (Cron tab), schedule `0 0 0 * * 0`.
  - name: image-tags
    image: docker.io/library/alpine:3
    commands:
      - apk add --no-cache git
      - |
        if [ -n "$${CI_COMMIT_TAG}" ]; then
          tags="$${CI_COMMIT_TAG}"
        elif [ "$${CI_COMMIT_BRANCH}" = main ]; then
          tags="$(printf 'stable\n%s' "$(printf %s "$${CI_COMMIT_SHA}" | cut -c1-7)")"
        else
          tags="$(printf %s "$${CI_COMMIT_BRANCH}" | tr / -)"
        fi
        # A branch commit that also carries git tags (e.g. a release commit
        # tagged right after the push) gets those tags too.
        if [ -z "$${CI_COMMIT_TAG}" ]; then
          git config --global --add safe.directory "$${CI_WORKSPACE}"
          tags="$(printf '%s\n%s' "$tags" "$(git tag --points-at "$${CI_COMMIT_SHA}")" | sed '/^$/d')"
        fi
        printf '%s\n' "$tags" > .tags
        echo "image tags: $(tr '\n' ' ' < .tags)"
    when:
      - event:
          - push
          - manual
          - tag
          - cron
  - name: publish
    !!merge <<: *buildx
    settings:
      !!merge <<: *buildx_settings
      tags_file: .tags
    when:
      - event:
          - push
          - manual
          - tag
          - cron
