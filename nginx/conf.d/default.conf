# default.conf

server {
    listen 80;

    server_name localhost;

    root /tmp/url-fairy-bot-cache/;

    error_page 404 /theme/404.html;
    error_page 403 =404 /theme/404.html;

    # Landing page, not a listing of the cache.
    location = / {
        root /theme;
        try_files /index.html =404;
    }

    # Cached files, by exact path. No listing here.
    location / {
        add_after_body "/theme/footer.html";
        add_before_body "/theme/header.html";
    }

    # The cache, deliberately browsable.
    location = /cache {
        return 301 /cache/;
    }
    location /cache/ {
        alias /tmp/url-fairy-bot-cache/;
        add_after_body "/theme/footer.html";
        add_before_body "/theme/header.html";
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location /theme {
        root /;
    }
}
