---
# docker-compose.yml

networks:
  traefik_default:
    external: true
  default:
services:
  app:
    image: docker.io/5mdt/url-fairy-bot:${IMAGE_TAG:-stable}
    restart: unless-stopped
    # #UFB-0036: `required: false` makes this a no-op when `telegram-bot-api`
    # isn't part of this run (the `local-bot-api` profile inactive) — without
    # it, Compose refuses to build the project at all in that case ("depends
    # on undefined service"). When the profile *is* active, `app` still waits
    # for `telegram-bot-api`'s own healthcheck before starting.
    depends_on:
      telegram-bot-api:
        condition: service_healthy
        required: false
    environment:
      BASE_URL: ${BASE_URL:-localhost}
      IV_RHASH: ${IV_RHASH:-}
      BOT_TOKEN: ${BOT_TOKEN:-YOUR_BOT_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CACHE_DIR: ${CACHE_DIR:-/tmp/url-fairy-bot-cache/}
      FILE_TTL: ${FILE_TTL:-3}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-3600}
      COOKIES_DIR: ${COOKIES_DIR:-/config/}
      COOKIE_JAR_ENABLED: ${COOKIE_JAR_ENABLED:-false}
      COOKIE_KEEPALIVE_INTERVAL: ${COOKIE_KEEPALIVE_INTERVAL:-3600}
      COOKIE_HEALTHCHECK: ${COOKIE_HEALTHCHECK:-false}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      ALERT_COOKIES: ${ALERT_COOKIES:-}
      ALERT_FAILURE_SPIKE: ${ALERT_FAILURE_SPIKE:-}
      ALERT_BOT_API: ${ALERT_BOT_API:-}
      ALERT_YTDLP: ${ALERT_YTDLP:-}
      ALERT_CACHE: ${ALERT_CACHE:-}
      ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-60}
      ALERT_MIN_INTERVAL: ${ALERT_MIN_INTERVAL:-3600}
      ALERT_FAILURE_SPIKE_MIN_ATTEMPTS: ${ALERT_FAILURE_SPIKE_MIN_ATTEMPTS:-5}
      # yamllint disable-line rule:line-length
      ALERT_FAILURE_SPIKE_WINDOW_MINUTES: ${ALERT_FAILURE_SPIKE_WINDOW_MINUTES:-10}
      ALERT_FAILURE_SPIKE_RATIO: ${ALERT_FAILURE_SPIKE_RATIO:-0.5}
      ALERT_YTDLP_MAX_AGE_DAYS: ${ALERT_YTDLP_MAX_AGE_DAYS:-60}
      ALERT_CACHE_FULL_PERCENT: ${ALERT_CACHE_FULL_PERCENT:-90}
      AUDIO_NORMALIZE_ENABLED: ${AUDIO_NORMALIZE_ENABLED:-false}
      AUDIO_NORMALIZE_BELOW_LUFS: ${AUDIO_NORMALIZE_BELOW_LUFS:--40}
      API_KEY: ${API_KEY:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-30}
      API_RATE_WINDOW: ${API_RATE_WINDOW:-60}
      REPORT_RATE_LIMIT: ${REPORT_RATE_LIMIT:-3}
      REPORT_RATE_WINDOW: ${REPORT_RATE_WINDOW:-3600}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      FOLLOW_REDIRECT_TIMEOUT: ${FOLLOW_REDIRECT_TIMEOUT:-10}
      DUPLICATE_WINDOW: ${DUPLICATE_WINDOW:-3600}
      DOWNLOAD_ALLOWED_DOMAINS: ${DOWNLOAD_ALLOWED_DOMAINS:-}
      REWRITE_ALLOWED_DOMAINS: ${REWRITE_ALLOWED_DOMAINS:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-}
      CLOUD_SEND_VIDEO_MAX_MB: ${CLOUD_SEND_VIDEO_MAX_MB:-10}
      LOCAL_SEND_VIDEO_MAX_MB: ${LOCAL_SEND_VIDEO_MAX_MB:-500}
      SPOTIFY_MIRROR_DOMAIN: ${SPOTIFY_MIRROR_DOMAIN:-fxspotify.com}
      INSTAGRAM_MIRROR_DOMAIN: ${INSTAGRAM_MIRROR_DOMAIN:-kkinstagram.com}
      REDDIT_MIRROR_DOMAIN: ${REDDIT_MIRROR_DOMAIN:-rxddit.com}
      THREADS_MIRROR_DOMAIN: ${THREADS_MIRROR_DOMAIN:-fx.akitsuki.me}
      TIKTOK_MIRROR_DOMAIN: ${TIKTOK_MIRROR_DOMAIN:-tfxktok.com}
      TWITTER_MIRROR_DOMAIN: ${TWITTER_MIRROR_DOMAIN:-fxtwitter.com}
      YOUTUBE_MIRROR_DOMAIN: ${YOUTUBE_MIRROR_DOMAIN:-yfxtube.com}
      YOUTUBE_SHORT_MIRROR_DOMAIN: ${YOUTUBE_SHORT_MIRROR_DOMAIN:-fxyoutu.be}
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "1m"
    volumes:
      # The mount path must match CACHE_DIR above (#BUG-0074).
      - cache:/tmp/url-fairy-bot-cache/
      - ${GLOBAL_DATA_FOLDER:-/Data}/url-fairy-bot/config:/config
    ports:
      - 8000:8000
    networks:
      - default
  nginx:
    image: nginx:stable-alpine-slim
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.docker.network: traefik_default
      traefik.enable: true
      traefik.http.routers.url-fairy-bot.entrypoints: websecure
      traefik.http.routers.url-fairy-bot.rule: Host(`${BASE_URL:-localhost}`)
      traefik.http.routers.url-fairy-bot.service: url-fairy-bot
      traefik.http.routers.url-fairy-bot.tls: true
      traefik.http.routers.url-fairy-bot.tls.certresolver: >-
        ${LETSENCRYPT_RESOLVER_NAME:-letsencrypt-cloudflare-dns-challenge}
      traefik.http.services.url-fairy-bot.loadbalancer.server.port: 80
    ports:
      - ${PUBLIC_PORT:-80:80}
    logging:
      driver: none
    networks:
      - traefik_default
    volumes:
      - cache:/usr/share/nginx/html:ro
    # #BUG-0067: serve the app-generated 404 page (UFB-0025/UFB-0033)
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
  # Optional: a self-hosted Telegram Bot API server in local mode, raising
  # the video-send ceiling above the cloud API's 50 MB (the default
  # CLOUD_SEND_VIDEO_MAX_MB is a deliberately lower 10 MB; see
  # docs/features/UFB-0036-native-video-replies.md). Disabled by default;
  # enable with `docker compose --profile local-bot-api up -d` after setting
  # TELEGRAM_API_ID/TELEGRAM_API_HASH and pointing TELEGRAM_API_URL at it.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    profiles:
      - local-bot-api
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: 1
    # Every real HTTP route on this server 404s/401s without a valid bot
    # token, so an HTTP-status healthcheck would always read as "down"; a
    # bare TCP connect just confirms the process is up and listening.
    healthcheck:
      test:
        - "CMD"
        - "nc"
        - "-z"
        - "127.0.0.1"
        - "8081"
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "1m"
    volumes:
      # Must match `app`'s CACHE_DIR: both containers need the cache at the
      # same path for local-mode file sends (#BUG-0074).
      - cache:/tmp/url-fairy-bot-cache/
      - botapi:/var/lib/telegram-bot-api
volumes:
  cache:
  botapi:
# Inline content keeps the deployment checkout-free (UFB-0030).
configs:
  nginx_default_conf:
    content: |
      # no blank lines in here: pre-commit's sort-simple-yaml splits on them
      server {
          listen 80;
          server_name localhost;
          root /usr/share/nginx/html;
          location / {
              index index.html;
          }
          error_page 404 /404.html;
          location = /404.html {
              internal;
          }
      }
